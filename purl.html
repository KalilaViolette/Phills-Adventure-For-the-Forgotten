<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purl Test Run</title>
<style>
  :root { --bg: #14161d; --ink: #e8e2d4; --dim: #9a94a8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  #help { position: fixed; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
  #help b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"><b>Purl, a test run.</b> Move: arrows or left stick. Jump: Z / Space / X. Thrust: X key / R1. Hook: C / R2 (tap to yank, hold to swing). Sew: hold V / L1 standing still. R: back to the start.</div>
<script src="js/purl_proto.js"></script>
</body>
</html>
